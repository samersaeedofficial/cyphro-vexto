<svg width="64" height="64" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cvx-bg" x1="24" y1="2" x2="24" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d1e" />
    </linearGradient>
    <linearGradient id="cvx-border" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="cvx-left" x1="14" y1="14" x2="24" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="cvx-right" x1="34" y1="14" x2="24" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a5b4fc" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <radialGradient id="cvx-tip" cx="24" cy="34" r="5" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0" />
    </radialGradient>
    <filter id="cvx-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Shield body -->
  <path d="M24 3 Q41 3 41 14 L41 30 Q41 44 24 46 Q7 44 7 30 L7 14 Q7 3 24 3 Z" fill="url(#cvx-bg)" stroke="url(#cvx-border)" stroke-width="1.8" />
  <!-- Inner ring -->
  <path d="M24 6.5 Q38 6.5 38 15 L38 30 Q38 41.5 24 43.5 Q10 41.5 10 30 L10 15 Q10 6.5 24 6.5 Z" fill="none" stroke="rgba(148,163,184,0.18)" stroke-width="0.8" />

  <!-- Left beam -->
  <path d="M13.5 14.5 L21 14.5 L25.5 33 L22 33 Z" fill="url(#cvx-left)" filter="url(#cvx-glow)" />
  <!-- Right beam -->
  <path d="M34.5 14.5 L27 14.5 L22.5 33 L26 33 Z" fill="url(#cvx-right)" filter="url(#cvx-glow)" />

  <!-- Tip glow -->
  <circle cx="24" cy="33.5" r="4.5" fill="url(#cvx-tip)" />
  <circle cx="24" cy="33.5" r="1.8" fill="#34d399" />
  
  <!-- Accent dots -->
  <circle cx="13.5" cy="14.5" r="1.8" fill="#60a5fa" />
  <circle cx="34.5" cy="14.5" r="1.8" fill="#818cf8" />
</svg>
